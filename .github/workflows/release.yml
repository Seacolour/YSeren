name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag to build, for example v0.1.0"
        required: true
        type: string

permissions:
  contents: write

env:
  TAG_NAME: ${{ github.event_name == 'workflow_dispatch' && inputs.tag_name || github.ref_name }}

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: windows
            goarch: amd64
            archive_ext: zip
            binary_name: yseren.exe
          - goos: windows
            goarch: arm64
            archive_ext: zip
            binary_name: yseren.exe
          - goos: linux
            goarch: amd64
            archive_ext: tar.gz
            binary_name: yseren
          - goos: linux
            goarch: arm64
            archive_ext: tar.gz
            binary_name: yseren
          - goos: darwin
            goarch: amd64
            archive_ext: tar.gz
            binary_name: yseren
          - goos: darwin
            goarch: arm64
            archive_ext: tar.gz
            binary_name: yseren

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Build release archive
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p dist package

          artifact="yseren_${TAG_NAME}_${{ matrix.goos }}_${{ matrix.goarch }}"
          package_dir="package/${artifact}"

          mkdir -p "${package_dir}"
          cp README.md LICENSE yseren.example.yaml "${package_dir}/"

          CGO_ENABLED=0 GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} \
            go build -trimpath -ldflags="-s -w" -o "${package_dir}/${{ matrix.binary_name }}" .

          if [ "${{ matrix.archive_ext }}" = "zip" ]; then
            (
              cd package
              zip -qr "../dist/${artifact}.zip" "${artifact}"
            )
          else
            tar -czf "dist/${artifact}.tar.gz" -C package "${artifact}"
          fi

      - name: Upload packaged artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*

  android:
    runs-on: ubuntu-latest
    env:
      HAS_ANDROID_SIGNING: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' && secrets.ANDROID_KEYSTORE_PASSWORD != '' && secrets.ANDROID_KEY_ALIAS != '' && secrets.ANDROID_KEY_PASSWORD != '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Make Android Gradle wrapper executable
        run: chmod +x android/gradlew

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Decode Android signing keystore
        if: env.HAS_ANDROID_SIGNING == 'true'
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/release.keystore

      - name: Build Android release APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/android/app/release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease --no-daemon

      - name: Package Android APK
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p dist
          signed_apk="android/app/build/outputs/apk/release/app-release.apk"
          unsigned_apk="android/app/build/outputs/apk/release/app-release-unsigned.apk"

          if [ -f "$signed_apk" ]; then
            cp "$signed_apk" "dist/yseren_${TAG_NAME}_android.apk"
          elif [ -f "$unsigned_apk" ]; then
            cp "$unsigned_apk" "dist/yseren_${TAG_NAME}_android-unsigned.apk"
          else
            echo "No release APK was produced" >&2
            exit 1
          fi

      - name: Upload Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-android
          path: dist/*

  release:
    runs-on: ubuntu-latest
    needs:
      - build
      - android

    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: release-*
          merge-multiple: true

      - name: Generate checksums
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          sha256sum * > SHA256SUMS.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          generate_release_notes: true
          files: dist/*
