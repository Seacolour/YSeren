name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag to build, for example v0.1.0"
        required: true
        type: string

permissions:
  contents: write

env:
  TAG_NAME: ${{ github.event_name == 'workflow_dispatch' && inputs.tag_name || github.ref_name }}

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: windows
            goarch: amd64
            archive_ext: zip
            binary_name: yseren.exe
          - goos: windows
            goarch: arm64
            archive_ext: zip
            binary_name: yseren.exe
          - goos: linux
            goarch: amd64
            archive_ext: tar.gz
            binary_name: yseren
          - goos: linux
            goarch: arm64
            archive_ext: tar.gz
            binary_name: yseren
          - goos: darwin
            goarch: amd64
            archive_ext: tar.gz
            binary_name: yseren
          - goos: darwin
            goarch: arm64
            archive_ext: tar.gz
            binary_name: yseren

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Build release archive
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p dist package

          artifact="yseren_${TAG_NAME}_${{ matrix.goos }}_${{ matrix.goarch }}"
          package_dir="package/${artifact}"

          mkdir -p "${package_dir}"
          cp README.md LICENSE yseren.example.yaml "${package_dir}/"

          CGO_ENABLED=0 GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} \
            go build -trimpath -ldflags="-s -w" -o "${package_dir}/${{ matrix.binary_name }}" .

          if [ "${{ matrix.archive_ext }}" = "zip" ]; then
            (
              cd package
              zip -qr "../dist/${artifact}.zip" "${artifact}"
            )
          else
            tar -czf "dist/${artifact}.tar.gz" -C package "${artifact}"
          fi

      - name: Upload packaged artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*

  release:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: release-*
          merge-multiple: true

      - name: Generate checksums
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          sha256sum * > SHA256SUMS.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          generate_release_notes: true
          files: dist/*
